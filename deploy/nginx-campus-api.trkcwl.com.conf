# campus-api.trkcwl.com —— 「校园趣事」小程序后端入口
#
# 这台服务器上还跑着别的项目，所以：
#   1. 域名带项目名（campus-），其它项目用各自的子域名，例如 blog-api.trkcwl.com
#   2. upstream 名字带项目前缀（campus_gateway），避免和别的项目重名冲突
#   3. 一个项目一个 conf 文件，用 include 挂进来，互不影响
#
# 结构：小程序 → HTTPS 443 → Nginx → 网关 127.0.0.1:8888 → 各微服务
# 放置：/etc/nginx/conf.d/campus-api.trkcwl.com.conf
# 生效：nginx -t && nginx -s reload
#
# 证书：/etc/nginx/ssl/ 下放 fullchain（含中间证书，iOS 对缺链很敏感）+ 私钥。
#       Let's Encrypt 建议用 certbot 自动续期，续期后 reload nginx。

upstream campus_gateway {
    server 127.0.0.1:8888;
    keepalive 32;
}

# HTTP 一律跳 HTTPS（小程序只走 HTTPS）
server {
    listen 80;
    server_name campus-api.trkcwl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campus-api.trkcwl.com;

    ssl_certificate     /etc/nginx/ssl/campus-api.trkcwl.com_fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/campus-api.trkcwl.com.key;

    # 微信要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：告知浏览器此后只走 HTTPS（首次上线先设短一点，确认全站 HTTPS 后再拉到 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 基础安全头（网关也会加一份，这里兜住不经过网关的 /uploads 直出）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 后端上限：图片 5MB、聊天视频 50MB（campus.upload.video-max-size），multipart 50MB，这里留余量；
    # 太小会在 413 阶段就失败，而且小程序只报「上传失败」很难查
    client_max_body_size 55m;
    client_body_timeout  120s;

    access_log /var/log/nginx/campus-api.trkcwl.com.access.log;
    error_log  /var/log/nginx/campus-api.trkcwl.com.error.log warn;

    # 图片由 Nginx 直出（**推荐启用**）。
    # 这样上传目录和读取路径由同一处（Nginx）决定，不再依赖 Java 进程的工作目录，
    # 也不会因为 Nacos 里残留多个 campus-user 实例而「上传到一个实例的目录、读取打到另一个实例」→ 404。
    # 前提：后端 UPLOAD_DIR 必须指向同一个绝对路径，且属主可读（www/www-data）。
    location ^~ /uploads/ {
        alias /mnt/ssd/web/campus-api.trkcwl.com/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 校友群 WebSocket（**必须单独一段**）
    #
    # 为什么不能用下面的 location /：
    #   ① 它没设 proxy_set_header Upgrade / Connection "upgrade"；
    #   ② 更致命的是它显式写了 proxy_set_header Connection ""（为了复用
    #      upstream keepalive），这一行会把升级所需的 Connection: upgrade 覆盖掉。
    # 结果就是握手失败、连接建立即断，Nginx 日志里只有 101/400，极难排查。
    #
    # 放行路径：小程序 wss://campus-api.trkcwl.com/api/ws?ticket=xxx
    # 鉴权：不走 Header（小程序无法自定义），由后端校验一次性 ticket。
    # ------------------------------------------------------------
    location /api/ws {
        proxy_pass http://campus_gateway;
        proxy_http_version 1.1;

        # 这两行是握手升级的关键，缺一行就 400 / 连接立刻断开
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        # 【安全】必须用 $remote_addr **覆盖**，不能用 $proxy_add_x_forwarded_for **追加**。
        # 追加语义会把客户端自带的伪造值留在最前面（客户端发 1.2.3.4 → 转出 1.2.3.4, 真实IP），
        # 后端只要取第一段就能被无限绕过限流；覆盖之后 XFF 只有一个值，伪造头直接被丢弃。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s 无数据就断；服务端 30s 一次心跳能维持，这里放宽到 1 小时，
        # 避免用户切后台一会儿回来就重连（重连要重新换 ticket + 补拉消息）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;

        # WebSocket 长连接不缓冲
        proxy_buffering off;
    }

    location / {
        proxy_pass http://campus_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 【安全】必须用 $remote_addr **覆盖**，不能用 $proxy_add_x_forwarded_for **追加**。
        # 追加语义会把客户端自带的伪造值留在最前面（客户端发 1.2.3.4 → 转出 1.2.3.4, 真实IP），
        # 后端只要取第一段就能被无限绕过限流；覆盖之后 XFF 只有一个值，伪造头直接被丢弃。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 upstream keepalive 配合，复用长连接
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 网关已处理跨域；这里不再重复添加
        proxy_buffering on;
    }
}
