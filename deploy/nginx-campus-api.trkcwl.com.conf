# campus-api.trkcwl.com —— 「校园趣事」小程序后端入口
#
# 这台服务器上还跑着别的项目，所以：
#   1. 域名带项目名（campus-），其它项目用各自的子域名，例如 blog-api.trkcwl.com
#   2. upstream 名字带项目前缀（campus_gateway），避免和别的项目重名冲突
#   3. 一个项目一个 conf 文件，用 include 挂进来，互不影响
#
# 结构：小程序 → HTTPS 443 → Nginx → 网关 127.0.0.1:8888 → 各微服务
# 放置：/etc/nginx/conf.d/campus-api.trkcwl.com.conf
# 生效：nginx -t && nginx -s reload
#
# 证书：/etc/nginx/ssl/ 下放 fullchain（含中间证书，iOS 对缺链很敏感）+ 私钥。
#       Let's Encrypt 建议用 certbot 自动续期，续期后 reload nginx。

upstream campus_gateway {
    server 127.0.0.1:8888;
    keepalive 32;
}

# HTTP 一律跳 HTTPS（小程序只走 HTTPS）
server {
    listen 80;
    server_name campus-api.trkcwl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campus-api.trkcwl.com;

    ssl_certificate     /etc/nginx/ssl/campus-api.trkcwl.com_fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/campus-api.trkcwl.com.key;

    # 微信要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 后端单文件上限 5MB（campus.upload.max-size），这里留余量；
    # 太小会在 413 阶段就失败，而且小程序只报「上传失败」很难查
    client_max_body_size 10m;
    client_body_timeout  60s;

    access_log /var/log/nginx/campus-api.trkcwl.com.access.log;
    error_log  /var/log/nginx/campus-api.trkcwl.com.error.log warn;

    # 图片由 Nginx 直出（**推荐启用**）。
    # 这样上传目录和读取路径由同一处（Nginx）决定，不再依赖 Java 进程的工作目录，
    # 也不会因为 Nacos 里残留多个 campus-user 实例而「上传到一个实例的目录、读取打到另一个实例」→ 404。
    # 前提：后端 UPLOAD_DIR 必须指向同一个绝对路径，且属主可读（www/www-data）。
    location ^~ /uploads/ {
        alias /mnt/ssd/web/campus-api.trkcwl.com/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://campus_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 upstream keepalive 配合，复用长连接
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 网关已处理跨域；这里不再重复添加
        proxy_buffering on;
    }
}
