<script>
  function appendQuickText(text) {
    const input = document.getElementById('messageInput');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const stream = document.getElementById('chatStream');
    if (!input || !stream || !input.value.trim()) return;

    const val = input.value.trim();
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    const wrapper = document.createElement('div');
    wrapper.className = 'flex items-start gap-space-sm max-w-[85%] self-end flex-row-reverse animate-fade-in';
    wrapper.innerHTML = `
      <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 text-on-primary shadow-sm font-label-md">
        <span>我</span>
      </div>
      <div class="flex flex-col items-end gap-1">
        <div class="bg-primary text-on-primary px-space-md py-2.5 rounded-2xl rounded-tr-sm shadow-[0_4px_12px_rgba(16,185,129,0.2)] font-body-md text-body-md leading-relaxed">
          ${escapeHtml(val)}
        </div>
        <div class="flex items-center gap-1 mr-1">
          <span class="text-[10px] text-outline font-label-sm">送达</span>
          <span class="text-[10px] text-outline font-body-sm">${timeStr}</span>
        </div>
      </div>
    `;

    stream.appendChild(wrapper);
    input.value = '';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('messageInput')?.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });
