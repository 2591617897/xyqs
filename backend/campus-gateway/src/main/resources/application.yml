server:
  port: 8888

spring:
  application:
    name: campus-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: campus-auth
          uri: lb://campus-auth
          predicates:
            - Path=/api/auth/**,/api/schools/**
          filters:
            - StripPrefix=1
        - id: campus-user
          uri: lb://campus-user
          predicates:
            - Path=/api/user/**,/api/upload
          filters:
            - StripPrefix=1
        - id: campus-goods
          uri: lb://campus-goods
          predicates:
            - Path=/api/goods/**
          filters:
            - StripPrefix=1
        - id: campus-wall
          uri: lb://campus-wall
          predicates:
            - Path=/api/wall/**
          filters:
            - StripPrefix=1
        - id: campus-post
          uri: lb://campus-post
          predicates:
            - Path=/api/posts/**,/api/channels/**
          filters:
            - StripPrefix=1
        - id: campus-message
          uri: lb://campus-message
          predicates:
            - Path=/api/messages/**
          filters:
            - StripPrefix=1
        # 上传后的图片由 user 服务的静态资源映射提供，不做前缀剥离
        - id: campus-file
          uri: lb://campus-user
          predicates:
            - Path=/uploads/**
  # 放宽单体请求内存上限，避免大图经网关转发时被截断
  codec:
    max-in-memory-size: 8MB

campus:
  jwt:
    secret: campus-fun-jwt-secret-key-please-change-in-prod-2026
    expire-hours: 168

logging:
  level:
    org.springframework.cloud.gateway: info
