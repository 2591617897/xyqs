server:
  port: 8888

spring:
  application:
    name: campus-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      routes:
        - id: campus-auth
          uri: lb://campus-auth
          predicates:
            - Path=/api/auth/**,/api/schools/**
          filters:
            - StripPrefix=1
        - id: campus-user
          uri: lb://campus-user
          predicates:
            - Path=/api/user/**,/api/upload
          filters:
            - StripPrefix=1
        - id: campus-goods
          uri: lb://campus-goods
          predicates:
            - Path=/api/goods/**
          filters:
            - StripPrefix=1
        - id: campus-wall
          uri: lb://campus-wall
          predicates:
            - Path=/api/wall/**
          filters:
            - StripPrefix=1
        - id: campus-post
          uri: lb://campus-post
          predicates:
            - Path=/api/posts/**,/api/channels/**
          filters:
            - StripPrefix=1
        - id: campus-message
          uri: lb://campus-message
          predicates:
            - Path=/api/messages/**
          filters:
            - StripPrefix=1
        # 微信「消息推送」回调：接收图片内容审核结果（media_check_async）。
        # 微信服务器从公网访问，必须走网关；落到 campus-auth 的 /wx/callback，
        # 由该接口自己做 sha1 签名校验，所以 AuthGlobalFilter 里同步放行 /api/wx/ 前缀。
        - id: campus-wx
          uri: lb://campus-auth
          predicates:
            - Path=/api/wx/**
          filters:
            - StripPrefix=1
        # 小程序后台管理：独立令牌体系（campus.admin.jwt.secret），
        # AuthGlobalFilter 里只对 POST /api/admin/auth/login 精确放行，其余必须带管理员令牌。
        # 注意这里剥两层：/api 是网关统一前缀，/admin 是后台服务前缀，
        # 剥完后落到 campus-admin 的 /auth/login、/admins、/roles ...
        - id: campus-admin
          uri: lb://campus-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2
        # 上传后的图片由 user 服务的静态资源映射提供，不做前缀剥离
        - id: campus-file
          uri: lb://campus-user
          predicates:
            - Path=/uploads/**
  # 放宽单体请求内存上限，避免大图经网关转发时被截断
  codec:
    max-in-memory-size: 8MB

campus:
  jwt:
    secret: ${JWT_SECRET:campus-fun-jwt-secret-key-please-change-in-prod-2026}
    expire-hours: 168
  admin:
    jwt:
      # 后台管理员令牌专用密钥，必须与 campus-admin 服务的 campus.admin.jwt.secret 一致。
      # HS256 要求密钥 >= 32 字节，改短会导致网关启动即抛 WeakKeyException。
      secret: ${ADMIN_JWT_SECRET:campus-admin-jwt-secret-key-change-me-please-32+}

logging:
  level:
    org.springframework.cloud.gateway: info
