server:
  port: 8102

spring:
  application:
    name: campus-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      pool-name: ${spring.application.name}HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    secret: campus-fun-jwt-secret-key-please-change-in-prod-2026
    expire-hours: 168
  verify:
    # true：提交即视为认证通过（本地联调）；false：进入人工/接口审核
    auto-approve: ${VERIFY_AUTO_APPROVE:true}
  upload:
    # 图片落盘目录（相对启动目录，IDEA/mvn 启动 = <模块目录>/uploads）。
    # 生产建议用绝对路径并对齐 Nginx 的 /uploads/ alias，或直接换对象存储
    dir: ${UPLOAD_DIR:./uploads}
    # 图片 URL 的外网前缀，**必须是用户/手机真正访问得到的地址**：
    #   - 域名上线：https://campus-api.trkcwl.com
    #   - 内网穿透：填穿透给的 https 域名（如 https://xxxx.cpolar.cn），
    #     绝不能填内网 IP —— 否则写进库的图片地址手机打不开
    base-url: ${UPLOAD_BASE_URL:https://campus-api.trkcwl.com}
    # 单文件上限（字节）。前端 utils/upload.js 已把超过 4MB 的图压到 4MB 内，
    # 这里放太大没有意义；且必须 ≤ Nginx 的 client_max_body_size，否则会先在 Nginx 被 413
    max-size: ${UPLOAD_MAX_SIZE:5242880}
