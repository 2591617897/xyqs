server:
  port: 8102

spring:
  application:
    name: campus-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      pool-name: ${spring.application.name}HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    # 【安全】此处的密钥不能再写字面量：留空时由 JwtService 从 JWT_SECRET 环境变量
    # 或 ~/.campus-secrets/jwt.key 读取（所有服务与网关必须是同一份）。
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  verify:
    # true：提交即视为认证通过（本地联调）；false：进入人工/接口审核
    auto-approve: ${VERIFY_AUTO_APPROVE:true}
    # 重认证冷却天数：已认证用户换学校/换材料的两次提交最短间隔。
    # 重认证一律转人工审核（不看 auto-approve），否则一次调用就能改学校分区。
    reapply-cooldown-days: ${VERIFY_REAPPLY_COOLDOWN_DAYS:7}
  account:
    # 注销后个人信息保留天数：期间重新登录可恢复（昵称/头像/简介还原），
    # 满期由定时任务清除全部个人信息并把 openid 换成占位值。
    # 需求写死「1 年」，做成配置是为了法务口径变更时不用改代码。
    cancel-retain-days: ${ACCOUNT_CANCEL_RETAIN_DAYS:365}
  upload:
    # 图片落盘目录（相对启动目录，IDEA/mvn 启动 = <模块目录>/uploads）。
    # 生产建议用绝对路径并对齐 Nginx 的 /uploads/ alias，或直接换对象存储
    dir: ${UPLOAD_DIR:./uploads}
    # 图片 URL 的外网前缀，**必须是用户/手机真正访问得到的地址**：
    #   - 域名上线：https://campus-api.trkcwl.com
    #   - 内网穿透：填穿透给的 https 域名（如 https://xxxx.cpolar.cn），
    #     绝不能填内网 IP —— 否则写进库的图片地址手机打不开
    base-url: ${UPLOAD_BASE_URL:https://campus-api.trkcwl.com}
    # 单文件上限（字节）。前端 utils/upload.js 已把超过 4MB 的图压到 4MB 内，
    # 这里放太大没有意义；且必须 ≤ Nginx 的 client_max_body_size，否则会先在 Nginx 被 413
    max-size: ${UPLOAD_MAX_SIZE:5242880}
    # 每人每天的上传配额（数量 / 总字节）。这是磁盘的最后一道闸：
    # 没有它，一个已登录账号可以无限次传 50MB 视频把磁盘写满，
    # 而这台机器上还跑着别的项目 —— 磁盘写满是跨项目故障。
    # 正常同学一天发几条闲置（每条 3~6 张图）远到不了；200MB 够 4 条 50MB 视频或 200 张图。
    daily-max-count: ${UPLOAD_DAILY_MAX_COUNT:60}
    daily-max-bytes: ${UPLOAD_DAILY_MAX_BYTES:209715200}
