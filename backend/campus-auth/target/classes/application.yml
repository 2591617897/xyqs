server:
  port: 8101

spring:
  application:
    name: campus-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    secret: campus-fun-jwt-secret-key-please-change-in-prod-2026
    expire-hours: 168
  auth:
    # 本地没有小程序 appid 时开启 mock：用 code / devOpenid 直接生成 openid
    mock: ${AUTH_MOCK:true}
  geo:
    # 腾讯位置服务 key（小程序定位后逆地理出城市）。
    # 注意：key 需在腾讯位置服务控制台「key 设置」中勾选开通 WebServiceAPI，
    # 后端逆地理才能解析成功；未开通/未配置时 /auth/geo/city 返回 available=false，
    # 前端自动回退到「学校所在市」。申请/管理：https://lbs.qq.com/
    qqmap-key: ${QQMAP_KEY:R3GBZ-74NLJ-FULFO-DWKJE-QVEY5-SPBJ2}
  wx:
    # 微信小程序（当前主端）
    appid: ${WX_APPID:}
    appsecret: ${WX_APPSECRET:}
  qq:
    # QQ 小程序（保留兼容，需要时填上即可）
    appid: ${QQ_APPID:}
    appsecret: ${QQ_APPSECRET:}
