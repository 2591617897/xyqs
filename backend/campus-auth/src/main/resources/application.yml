server:
  port: 8101

spring:
  application:
    name: campus-auth
  profiles:
    # 默认激活 local：小程序 appid/appsecret 放在 application-local.yml（已被 .gitignore 忽略）。
    # 缺失该文件时不会报错，只是登录会提示「微信登录未配置」；
    # 部署环境可用 SPRING_PROFILES_ACTIVE 覆盖，或用环境变量 WX_APPSECRET 直接注入。
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      pool-name: ${spring.application.name}HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    secret: campus-fun-jwt-secret-key-please-change-in-prod-2026
    expire-hours: 168
  auth:
    # mock=true 时不会调用微信 code2Session，而是直接用请求里的 devOpenid（或按 code 哈希）
    # 当 openid —— 所有宿主账号会落到同一个用户，**只能本地单人演示**。
    # 默认关闭（AUTH_MOCK=false），否则多个微信登录会变成同一个账号。
    mock: ${AUTH_MOCK:false}
  geo:
    # 腾讯位置服务 key（小程序定位后逆地理出城市）。
    # 注意：key 需在腾讯位置服务控制台「key 设置」中勾选开通 WebServiceAPI，
    # 后端逆地理才能解析成功；未开通/未配置时 /auth/geo/city 返回 available=false，
    # 前端自动回退到「学校所在市」。申请/管理：https://lbs.qq.com/
    qqmap-key: ${QQMAP_KEY:R3GBZ-74NLJ-FULFO-DWKJE-QVEY5-SPBJ2}
    # key 若在控制台开启了「签名校验」，必须填 SK，否则 WebService 返回 status=111
    # （控制台 → 该 key → 签名校验；关掉的话这里留空即可）
    qqmap-sk: ${QQMAP_SK:SJhhXXNWWMTNIV59Ss4xrk79LDe5QKUj}
  wx:
    # 微信小程序（当前主端）。appid 与 project.config.json 保持一致；
    # appsecret 必须由环境变量 WX_APPSECRET 提供（不要写进仓库）。
    appid: ${WX_APPID:wx2cac838bfcc963d7}
    appsecret: ${WX_APPSECRET:}
    sec-check:
      # 内容安全审核（msg_sec_check v2）总开关。
      # 默认 false：未配 appsecret 时不影响发帖；本地与 CI 不被外部依赖卡住。
      # 生产启用条件：① WX_APPSECRET 已注入 ② 本开关置 true。
      # 生效后发帖/评论/改昵称/私信会先过微信内容安全，命中违规返回「内容涉嫌违规」。
      enabled: ${WX_SEC_CHECK:false}
      # 图片异步审核（media_check_async）单独开关，默认跟随总开关。
      # 本地联调可置 false：微信要求 media_url 公网可达，localhost/局域网 IP 必然送审失败。
      media-enabled: ${WX_MEDIA_CHECK:true}
    # 微信「消息推送」的 Token，图片审核结果回调（/api/wx/callback）用它验签。
    # 未配置时回调一律拒绝——宁可丢审核结果，也不能让任意人往台账写数据。
    # 配置位置：公众平台 → 开发管理 → 开发设置 → 消息推送 → Token
    callback-token: ${WX_CALLBACK_TOKEN:}
  qq:
    # QQ 小程序（保留兼容，需要时填上即可）
    appid: ${QQ_APPID:}
    appsecret: ${QQ_APPSECRET:}
