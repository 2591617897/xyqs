server:
  port: 8107

spring:
  application:
    name: campus-admin
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # Spring 默认 multipart 上限只有 1MB，后台传广告素材原图必然超限，
  # 直接抛 MaxUploadSizeExceededException（GlobalExceptionHandler 兜成「图片太大」），
  # 业务层的 5MB 校验（campus.admin.upload.max-size）反而永远执行不到。
  # 这里放宽到 20MB，让超出业务上限的请求由 UploadController 给出带 MB 数的明确提示。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 找回密码走 MQ：本服务只投递消息，SMTP 凭据和邮件正文都归 campus-mail。
  # 本机安装版默认 guest/guest；用根目录 docker-compose.yml 起的 MQ 请配
  # RABBITMQ_USER=campus / RABBITMQ_PASSWORD=campus123
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      pool-name: ${spring.application.name}HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    # 【安全】密钥来自环境变量 JWT_SECRET 或 ~/.campus-secrets/jwt.key
    secret: ${JWT_SECRET:}
  admin:
    jwt:
      # 必须与网关 campus.admin.jwt.secret 完全一致，否则网关注入的 admin token 在本服务解析不了。
      # 【安全】同样不留字面量：留空时由 AdminJwtService 从 ADMIN_JWT_SECRET 或
      # ~/.campus-secrets/admin-jwt.key 读取。HS256 要求 >= 32 字节。
      secret: ${ADMIN_JWT_SECRET:}
      # 后台令牌远短于小程序令牌（168 小时）
      expire-hours: ${ADMIN_JWT_EXPIRE_HOURS:8}
    # 登录风控：连续失败达到 max-fail 次后锁定 lock-minutes 分钟
    login:
      max-fail: 5
      lock-minutes: 15
    # 邮箱找回密码
    reset-pwd:
      # 验证码有效期（分钟）
      code-minutes: ${ADMIN_RESET_CODE_MINUTES:10}
      # 单个验证码最多可试错次数，超了必须重新获取
      max-attempt: 5
      # 同一账号两次发码的最短间隔（秒）
      resend-seconds: 60
      # 同一账号 24 小时内最多发码次数
      daily-limit: 5
      # 同一 IP 1 小时内最多发码次数（防枚举账号 + 邮件轰炸）
      ip-hourly-limit: 20
    upload:
      # 广告素材上传：必须与 campus-user 的 campus.upload.dir 指向同一物理目录，
      # 否则后台上传成功、图片访问 404（网关 /uploads/** 由 campus-user 提供）。
      # 默认值刻意写成 ../campus-user/uploads 而不是 ./uploads：两边都是相对各自的
      # 启动目录解析，各写 ./uploads 就会变成「写 A 读 B」——本机实测就是这样，
      # 后台传上去的素材在列表里全是灰块。生产仍用 UPLOAD_DIR 绝对路径把两边统一。
      dir: ${UPLOAD_DIR:../campus-user/uploads}
      base-url: ${UPLOAD_BASE_URL:http://127.0.0.1:8888}
      max-size: ${ADMIN_UPLOAD_MAX_SIZE:5242880}
