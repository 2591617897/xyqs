server:
  port: 8106

spring:
  application:
    name: campus-message
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/guizhou_campus_fun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      pool-name: MessageHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

campus:
  jwt:
    # 【安全】密钥来自环境变量 JWT_SECRET 或 ~/.campus-secrets/jwt.key
    secret: ${JWT_SECRET:}
  wx:
    # 订阅消息模板 id（逗号分隔，最多 3 个 —— 具体上限以微信官方文档为准）。
    # 留空 = 微信提醒未开通：前端只展示入口、不发起授权请求（拿空数组调接口只会失败）。
    # 后期绑定服务号 / 在小程序后台「订阅消息 → 我的模板」拿到 id 后，
    # 配环境变量 WX_SUBSCRIBE_TEMPLATES 即可生效，前端一行都不用改。
    subscribe-templates: ${WX_SUBSCRIBE_TEMPLATES:}
